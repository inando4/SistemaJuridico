<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina}">Nuevo proceso judicial</title>
  <th:block th:replace="~{fragments/presentacion :: recursos}"></th:block>
</head>
<body>
<header th:replace="~{fragments/presentacion :: selector}"></header>
<nav th:replace="~{fragments/navegacion :: principal('judiciales')}"></nav>
<main id="contenido" style="max-width:48rem">
  <h1>Editar proceso judicial</h1>
  <p class="tenue">
    Responsable: <span th:text="${expediente.ownerName}">Nombre</span>.
    Los cambios quedan registrados en el historial con su nombre.
  </p>

  <div th:replace="~{fragments/errores :: resumen}"></div>

  <form th:action="@{/judiciales/{id}(id=${expediente.id})}" method="post" th:object="${form}">
    <input type="hidden" name="version" th:value="*{version}">
    <input type="hidden" name="volver" th:if="${consultaRetorno != null}" th:value="${consultaRetorno}">

    <label for="caseNumber">N.º de expediente <span class="error">*</span></label>
    <input type="text" id="caseNumber" name="caseNumber" required
           th:value="*{caseNumber}" maxlength="150" th:attr="aria-invalid=${errores.containsKey('caseNumber')},aria-describedby=${errores.containsKey('caseNumber') ? 'error-caseNumber' : null}">
    <p id="error-caseNumber" class="error" th:if="${errores.containsKey('caseNumber')}" th:text="${errores['caseNumber']}"></p>

    <label for="sequenceNumber">N.º correlativo</label>
    <input type="text" id="sequenceNumber" name="sequenceNumber" th:value="*{sequenceNumber}"
           inputmode="numeric" th:attr="aria-invalid=${errores.containsKey('sequenceNumber')},aria-describedby=${errores.containsKey('sequenceNumber') ? 'error-sequenceNumber' : null}">
    <p id="error-sequenceNumber" class="error" th:if="${errores.containsKey('sequenceNumber')}" th:text="${errores['sequenceNumber']}"></p>

    <label for="claimant">Demandante</label>
    <input type="text" id="claimant" name="claimant" th:value="*{claimant}" th:attr="aria-invalid=${errores.containsKey('claimant')},aria-describedby=${errores.containsKey('claimant') ? 'error-claimant' : null}" maxlength="10000">
    <p id="error-claimant" class="error" th:if="${errores.containsKey('claimant')}" th:text="${errores['claimant']}"></p>

    <label for="respondent">Demandado</label>
    <input type="text" id="respondent" name="respondent" th:value="*{respondent}" th:attr="aria-invalid=${errores.containsKey('respondent')},aria-describedby=${errores.containsKey('respondent') ? 'error-respondent' : null}" maxlength="10000">
    <p id="error-respondent" class="error" th:if="${errores.containsKey('respondent')}" th:text="${errores['respondent']}"></p>

    <label for="subject">Materia o pretension</label>
    <input type="text" id="subject" name="subject" th:value="*{subject}" th:attr="aria-invalid=${errores.containsKey('subject')},aria-describedby=${errores.containsKey('subject') ? 'error-subject' : null}" maxlength="10000">
    <p id="error-subject" class="error" th:if="${errores.containsKey('subject')}" th:text="${errores['subject']}"></p>

    <label for="proceduralStatusId">Estado procesal</label>
    <select id="proceduralStatusId" name="proceduralStatusId" th:attr="aria-invalid=${errores.containsKey('proceduralStatusId')},aria-describedby=${errores.containsKey('proceduralStatusId') ? 'error-proceduralStatusId' : null}">
      <option value="">Sin estado asignado</option>
      <!-- Solo los habilitados: uno retirado no vuelve a ofrecerse. -->
      <option th:each="e : ${estados}" th:value="${e.id}" th:text="${e.name}"
              th:selected="${e.id.toString() == form.proceduralStatusId?.toString()}">Estado</option>
    </select>
    <p id="error-proceduralStatusId" class="error" th:if="${errores.containsKey('proceduralStatusId')}" th:text="${errores['proceduralStatusId']}"></p>
    <p class="tenue" th:if="${#lists.isEmpty(estados)}">
      No hay estados en el catalogo todavia.
    </p>

    <label for="lastProceduralAction">Último acto procesal</label>
    <input type="text" id="lastProceduralAction" name="lastProceduralAction"
           th:value="*{lastProceduralAction}" th:attr="aria-invalid=${errores.containsKey('lastProceduralAction')},aria-describedby=${errores.containsKey('lastProceduralAction') ? 'error-lastProceduralAction' : null}" maxlength="10000">
    <p id="error-lastProceduralAction" class="error" th:if="${errores.containsKey('lastProceduralAction')}" th:text="${errores['lastProceduralAction']}"></p>

    <label for="lastActionDate">Fecha del último acto</label>
    <input type="date" id="lastActionDate" name="lastActionDate" th:value="*{lastActionDate}" th:attr="aria-invalid=${errores.containsKey('lastActionDate')},aria-describedby=${errores.containsKey('lastActionDate') ? 'error-lastActionDate' : null}">
    <p id="error-lastActionDate" class="error" th:if="${errores.containsKey('lastActionDate')}" th:text="${errores['lastActionDate']}"></p>

    <label for="nextProceduralAction">Siguiente acto procesal</label>
    <input type="text" id="nextProceduralAction" name="nextProceduralAction"
           th:value="*{nextProceduralAction}" th:attr="aria-invalid=${errores.containsKey('nextProceduralAction')},aria-describedby=${errores.containsKey('nextProceduralAction') ? 'error-nextProceduralAction' : null}" maxlength="10000">
    <p id="error-nextProceduralAction" class="error" th:if="${errores.containsKey('nextProceduralAction')}" th:text="${errores['nextProceduralAction']}"></p>

    <label for="deadline">Fecha límite</label>
    <input type="date" id="deadline" name="deadline" th:value="*{deadline}" th:attr="aria-invalid=${errores.containsKey('deadline')},aria-describedby=${errores.containsKey('deadline') ? 'error-deadline' : null}">
    <p id="error-deadline" class="error" th:if="${errores.containsKey('deadline')}" th:text="${errores['deadline']}"></p>

    <label for="amount">Monto (PEN)</label>
    <input type="text" id="amount" name="amount" th:value="*{amount}" inputmode="decimal" th:attr="aria-invalid=${errores.containsKey('amount')},aria-describedby=${errores.containsKey('amount') ? 'error-amount' : null}">
    <p id="error-amount" class="error" th:if="${errores.containsKey('amount')}" th:text="${errores['amount']}"></p>
    <p class="tenue">Admite coma o punto decimal. Máximo dos decimales.</p>

    <label for="propertyAddress">Direccion del inmueble</label>
    <input type="text" id="propertyAddress" name="propertyAddress" th:value="*{propertyAddress}" th:attr="aria-invalid=${errores.containsKey('propertyAddress')},aria-describedby=${errores.containsKey('propertyAddress') ? 'error-propertyAddress' : null}" maxlength="1000">
    <p id="error-propertyAddress" class="error" th:if="${errores.containsKey('propertyAddress')}" th:text="${errores['propertyAddress']}"></p>

    <label for="notes">Observaciones</label>
    <textarea id="notes" name="notes" rows="3" th:text="*{notes}" th:attr="aria-invalid=${errores.containsKey('notes')},aria-describedby=${errores.containsKey('notes') ? 'error-notes' : null}" maxlength="10000"></textarea>
    <p id="error-notes" class="error" th:if="${errores.containsKey('notes')}" th:text="${errores['notes']}"></p>

    <label for="managementActions">Acciones de gerencia</label>
    <textarea id="managementActions" name="managementActions" rows="3"
              th:text="*{managementActions}" th:attr="aria-invalid=${errores.containsKey('managementActions')},aria-describedby=${errores.containsKey('managementActions') ? 'error-managementActions' : null}" maxlength="10000"></textarea>
    <p id="error-managementActions" class="error" th:if="${errores.containsKey('managementActions')}" th:text="${errores['managementActions']}"></p>

    <p>
      <button type="submit">Guardar cambios</button>
      <a th:href="@{/judiciales/{id}(id=${expediente.id},volver=${consultaRetorno})}">Cancelar</a>
    </p>
  </form>
</main>
</body>
</html>
