<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina}">Nueva cuenta</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main style="max-width:32rem">
  <p><a th:href="@{/usuarios}">&larr; Volver a las cuentas</a></p>
  <h1>Dar de alta una cuenta</h1>
  <p class="tenue">
    Al guardar se generara un codigo que debera entregar en mano. El sistema no
    envia correos.
  </p>

  <p th:if="${error}" role="alert" class="error" th:text="${error}">Error</p>

  <form th:action="@{/usuarios}" method="post">
    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" required autofocus maxlength="150">

    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required maxlength="254">
    <p class="tenue">Sirve para identificarse al entrar. No se le enviara nada.</p>

    <label for="role">Rol</label>
    <select id="role" name="role" required>
      <option value="LAWYER">Abogado</option>
      <option value="HEAD">Jefa</option>
    </select>

    <p><button type="submit">Crear cuenta y generar codigo</button></p>
  </form>
</main>
</body>
</html>
