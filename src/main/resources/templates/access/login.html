<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{acceso.titulo}">Iniciar sesion</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main style="max-width:26rem">
  <h1 th:text="#{app.nombre}">Sistema Juridico</h1>
  <p class="tenue" th:text="#{app.institucion}">Sociedad de Beneficencia de Arequipa</p>

  <!-- El aviso se anuncia tambien por texto y con role=alert: no depende del color. -->
  <p th:if="${aviso}" role="alert"
     th:classappend="${avisoEsError} ? 'error' : 'tenue'"
     th:text="#{${aviso}}">Mensaje</p>

  <form th:action="@{/login}" method="post">
    <label for="email" th:text="#{acceso.correo}">Correo</label>
    <input type="email" id="email" name="email" required autofocus
           autocomplete="username" inputmode="email">

    <label for="password" th:text="#{acceso.contrasena}">Contrasena</label>
    <input type="password" id="password" name="password" required
           autocomplete="current-password">

    <p><button type="submit" th:text="#{acceso.entrar}">Entrar</button></p>
  </form>

  <p class="tenue" th:text="#{acceso.sin-acceso}">
    Si olvido su contrasena, solicite un codigo a la jefatura del area.
  </p>
</main>
</body>
</html>
