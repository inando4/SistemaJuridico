<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina}">Cambiar mi contraseña</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main style="max-width:30rem">
  <p><a th:href="@{/judiciales}">&larr; Volver</a></p>
  <h1>Cambiar mi contraseña</h1>
  <p class="tenue">
    Puede hacerlo cuando quiera y sin pedir permiso. Al cambiarla se cerraran todas
    sus sesiones, incluida esta.
  </p>

  <p th:if="${error}" role="alert" class="error" th:text="${error}">Error</p>

  <form th:action="@{/cuenta/contrasena}" method="post">
    <label for="currentPassword">Contraseña actual</label>
    <input type="password" id="currentPassword" name="currentPassword" required
           autocomplete="current-password">

    <label for="password">Contraseña nueva</label>
    <input type="password" id="password" name="password" required
           autocomplete="new-password" minlength="15">

    <label for="passwordConfirmation">Repita la contraseña nueva</label>
    <input type="password" id="passwordConfirmation" name="passwordConfirmation" required
           autocomplete="new-password">

    <p><button type="submit">Cambiar contraseña</button></p>
  </form>
</main>
</body>
</html>
