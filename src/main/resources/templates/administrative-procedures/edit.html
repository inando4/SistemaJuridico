<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina}">Nuevo procedimiento administrativo</title>
  <th:block th:replace="~{fragments/presentacion :: recursos}"></th:block>
</head>
<body>
<header th:replace="~{fragments/presentacion :: selector}"></header>
<nav th:replace="~{fragments/navegacion :: principal('administrativos')}"></nav>
<main id="contenido" style="max-width:48rem">
  <h1>Editar procedimiento administrativo</h1>
  <p class="tenue">
    Responsable: <span th:text="${procedimiento.ownerName}">Nombre</span>.
    Los cambios quedan registrados en el historial con su nombre.
  </p>

  <div th:replace="~{fragments/errores :: resumen}"></div>

  <form th:action="@{/administrativos/{id}(id=${procedimiento.id})}" method="post" th:object="${form}">
    <input type="hidden" name="version" th:value="*{version}">
    <input type="hidden" name="volver" th:if="${consultaRetorno != null}" th:value="${consultaRetorno}">

    <label for="fileNumber">N.º de expediente <span class="error">*</span></label>
    <input type="text" id="fileNumber" name="fileNumber" required
           th:value="*{fileNumber}" maxlength="150" th:attr="aria-invalid=${errores.containsKey('fileNumber')},aria-describedby=${errores.containsKey('fileNumber') ? 'error-fileNumber' : null}">
    <p id="error-fileNumber" class="error" th:if="${errores.containsKey('fileNumber')}" th:text="${errores['fileNumber']}"></p>

    <label for="requestingArea">Área solicitante</label>
    <input type="text" id="requestingArea" name="requestingArea" th:value="*{requestingArea}"
           maxlength="1000" th:attr="aria-invalid=${errores.containsKey('requestingArea')},aria-describedby=${errores.containsKey('requestingArea') ? 'error-requestingArea' : null}">
    <p id="error-requestingArea" class="error" th:if="${errores.containsKey('requestingArea')}" th:text="${errores['requestingArea']}"></p>
    <p class="tenue">Que area de la institucion hizo el pedido.</p>

    <label for="request">Pedido</label>
    <textarea id="request" name="request" rows="3" th:text="*{request}" th:attr="aria-invalid=${errores.containsKey('request')},aria-describedby=${errores.containsKey('request') ? 'error-request' : null}" maxlength="10000"></textarea>
    <p id="error-request" class="error" th:if="${errores.containsKey('request')}" th:text="${errores['request']}"></p>

    <label for="administrativeStatusId">Estado</label>
    <select id="administrativeStatusId" name="administrativeStatusId" th:attr="aria-invalid=${errores.containsKey('administrativeStatusId')},aria-describedby=${errores.containsKey('administrativeStatusId') ? 'error-administrativeStatusId' : null}">
      <option value="">Sin estado asignado</option>
      <option th:each="e : ${estados}" th:value="${e.id}" th:text="${e.name}"
              th:selected="${e.id.toString() == form.administrativeStatusId?.toString()}">Estado</option>
    </select>
    <p id="error-administrativeStatusId" class="error" th:if="${errores.containsKey('administrativeStatusId')}" th:text="${errores['administrativeStatusId']}"></p>
    <p class="tenue" th:if="${#lists.isEmpty(estados)}">
      No hay estados en el catalogo todavia.
    </p>

    <label for="receivedAt">Fecha de recepción</label>
    <input type="date" id="receivedAt" name="receivedAt" th:value="*{receivedAt}" th:attr="aria-invalid=${errores.containsKey('receivedAt')},aria-describedby=${errores.containsKey('receivedAt') ? 'error-receivedAt' : null}">
    <p id="error-receivedAt" class="error" th:if="${errores.containsKey('receivedAt')}" th:text="${errores['receivedAt']}"></p>
    <p class="tenue">Cuando llego el pedido. No se rellena sola.</p>

    <label for="deadline">Fecha límite</label>
    <input type="date" id="deadline" name="deadline" th:value="*{deadline}" th:attr="aria-invalid=${errores.containsKey('deadline')},aria-describedby=${errores.containsKey('deadline') ? 'error-deadline' : null}">
    <p id="error-deadline" class="error" th:if="${errores.containsKey('deadline')}" th:text="${errores['deadline']}"></p>

    <label for="notes">Observaciones</label>
    <textarea id="notes" name="notes" rows="3" th:text="*{notes}" th:attr="aria-invalid=${errores.containsKey('notes')},aria-describedby=${errores.containsKey('notes') ? 'error-notes' : null}" maxlength="10000"></textarea>
    <p id="error-notes" class="error" th:if="${errores.containsKey('notes')}" th:text="${errores['notes']}"></p>

    <p>
      <button type="submit">Guardar cambios</button>
      <a th:href="@{/administrativos/{id}(id=${procedimiento.id},volver=${consultaRetorno})}">Cancelar</a>
    </p>
  </form>
</main>
</body>
</html>
