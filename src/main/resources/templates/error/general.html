<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina}">No pudimos completar la solicitud</title>
  <th:block th:replace="~{fragments/presentacion :: recursos}"></th:block>
</head>
<body>
<header th:replace="~{fragments/presentacion :: selector}"></header>
<main id="contenido">
  <h1 th:text="${tituloPagina}">No pudimos completar la solicitud</h1>
  <p th:text="${ayuda}">Vuelva al inicio para continuar.</p>
  <p><a th:href="@{/}">Volver al inicio</a></p>
  <p class="tenue">Código de respuesta: <span th:text="${estado}">500</span></p>
</main>
</body>
</html>
